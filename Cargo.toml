[package]
name = "aura"
version = "0.19.39"
edition = "2024"

# Public release workspace: the aura CLI (root package) + its vendored
# member crates under crates/. Mirrors the modular sovereign layout.
[workspace]
members = ["crates/*", "desktop/src-tauri"]
# aura-stackgraph is a STANDALONE binary crate: its parser stack pins
# tree-sitter 0.26 (and tree-sitter-java =0.23.4), which collides with the
# workspace's tree-sitter 0.23.5 via `links = "tree-sitter"`. It is wired in
# by shelling out to its binary over stdio, so it must stay out of the
# workspace resolution graph.
exclude = ["crates/aura-stackgraph"]
resolver = "2"

# The `aura` binary itself is auto-discovered from src/main.rs (package name).
# `git-remote-aura` is the git remote helper for the `aura://` scheme: git finds
# it on PATH and runs it as `git-remote-aura <remote> <url>`. It rewrites the URL
# to the node's smart-HTTP and execs git's own git-remote-http. See
# `src/bin/git_remote_aura.rs`.
[[bin]]
name = "git-remote-aura"
path = "src/bin/git_remote_aura.rs"

[dependencies]
# These three live under `crates/` rather than beside us at the repo root.
# They began as standalone Naridon-Inc repos and were still being consumed as
# `../aura-toon` etc. — paths that pointed at working copies nobody but us had,
# because those directories are separate git repos and were gitignored here. A
# fresh clone therefore failed to *resolve* this manifest, let alone build it.
# Vendored in at `crates/<name>` they are ordinary tracked files, so `git clone`
# + `cargo build` works with no second step. See `crates/README.md` for the
# upstream remotes and the commits each was taken from.
aura-toon = { path = "crates/aura-toon" }
aura-merge = { path = "crates/aura-merge" }
aura-agents = { path = "crates/aura-agents" }
aura-attestation = { path = "crates/aura-attestation" }
aura-plugin-sign = { path = "crates/aura-plugin-sign" }
aura-blocks      = { path = "crates/aura-blocks" }
aura-blockstore  = { path = "crates/aura-blockstore" }
# The project's declared environment — toolchains, packages, services — parsed,
# signed and turned into an ordered plan. The CLI drives that plan through
# `std::process`, the desktop app drives the same plan through `Place::sh`, so a
# laptop and a box converge through one implementation rather than two.
aura-env         = { path = "crates/aura-env" }
aura-egress      = { path = "crates/aura-egress" }
aura-loop        = { path = "crates/aura-loop" }
aura-policy       = { path = "crates/aura-policy" }
# Semantic CI — declarative .aura/pipelines that orchestrate the gates we
# already own. Dependency-light + one-way: aura-ci never depends back on this
# crate (the CLI feeds it facts via GateContext), so there is no cycle. See
# `src/ci.rs` for the fact-gathering + wiring.
aura-ci          = { path = "crates/aura-ci" }
# Always-on secret/PII scrubber. Awareness events are metadata that leave the
# local box (pushed to teammates via LiveTransport), so every outbound free-text
# field is run through this before it is signed + persisted. See
# `src/awareness/emit.rs`.
aura-redact      = { path = "crates/aura-redact" }
# Pure unified-diff line index, shared with aura-cloud so the local
# (`aura review post`) and cloud (`/api/v2/pr/review`) PR-review paths anchor
# inline comments to real diff lines identically. See `src/review/github.rs`.
aura-prdiff      = { path = "crates/aura-prdiff" }
# S1-G aura-stackgraph (Python + TypeScript find-refs/find-defs) is
# *not* a direct dep here: stack-graphs pins tree-sitter 0.24 and our
# parser stack pins 0.26 — `links = "tree-sitter"` collides. Wire-up
# is via the standalone `aura-stackgraph` binary; the MCP handler
# shells out and reads JSON over stdio. See `aura-stackgraph/src/bin/`
# for the protocol.
axum = "0.8.8"
bincode = "1"
clap = { version = "4.5.60", features = ["derive", "env"] }
clap_complete = "4.5"
colored = "3.1.1"
git2 = { version = "0.20.4", features = ["vendored-openssl", "vendored-libgit2"] }
indicatif = "0.18.4"
notify = "8.2.0"
petgraph = "0.8.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
age = "0.11.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Round-trip-preserving TOML for `.aura/settings.toml` reads/writes (per-repo
# worktree settings: `[worktree]`/`[git] base`/`[copy] files`). toml_edit keeps
# unrelated tables, keys, comments and formatting intact on save. See
# `src/repo_settings.rs`.
toml_edit = "0.22"
strsim = "0.11.1"
textwrap = "0.16.2"
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
tree-sitter = "0.26.6"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
uuid = { version = "1.21.0", features = ["v4", "v7"] }
regex = "1.12.3"
dialoguer = "0.12.0"
directories = "6.0.0"
figlet-rs = "0.1.5"
sysinfo = "0.36.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-c = "0.24.1"
tree-sitter-php = "0.24.2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
bcrypt = "0.17"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
rcgen = "0.13"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
serde_yaml = "0.9"
ctrlc = "3.4"
tree-sitter-swift = "0.7.1"
tree-sitter-kotlin-ng = "1.1.0"
libloading = "0.8"
tempfile = "3"
# Used by `aura subagent spawn-bg` to call libc::setsid() in a
# pre_exec hook so we can detach without depending on the external
# `setsid(1)` binary (missing on macOS by default).
libc = "0.2"

# Added for src/crdt.rs + src/crypto.rs (plan W4 CRDT session + W6 E2E
# crypto). These modules were added to src/ without touching Cargo.toml
# and produced ~95 build errors on `feat/extract-tier1-crates`.
yrs = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["std"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# src/live_ws.rs (plan W2.1b — cloud live plane WS client) and
# src/cloud_connect.rs (device-flow login) finish the dep-gap started
# above. `MaybeTlsStream` + `IntoClientRequest` are the 0.21 API shape.
tungstenite = { version = "0.21", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
webbrowser = "1"
# src/intent_block.rs needs OffsetDateTime to construct Block timestamps.
# aura-blocks uses it on the public API but does not re-export it.
time = { version = "0.3", features = ["serde", "serde-well-known"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
