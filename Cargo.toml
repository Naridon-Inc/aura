[package]
name = "aura"
version = "0.2.10"
edition = "2024"

[dependencies]
axum = "0.8.8"
bincode = "1"
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
git2 = { version = "0.20.4", features = ["vendored-openssl", "vendored-libgit2"] }
indicatif = "0.18.4"
notify = "8.2.0"
petgraph = "0.8.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
age = "0.11.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strsim = "0.11.1"
textwrap = "0.16.2"
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
tree-sitter = "0.26.6"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
uuid = { version = "1.21.0", features = ["v4"] }
regex = "1.12.3"
dialoguer = "0.12.0"
directories = "6.0.0"
figlet-rs = "0.1.5"
sysinfo = "0.36.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
