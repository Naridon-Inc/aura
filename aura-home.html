<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Sovereign Semantic Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            overflow-x: hidden; 
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.06); 
        }
        .glass-panel-hover:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar-link {
            transition: all 0.2s ease;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-right: 2px solid #10b981;
        }
        .grid-bg { 
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px; 
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body class="grid-bg min-h-screen selection:bg-emerald-500/30 flex">
    <div id="root" class="w-full h-screen flex overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion; 

        // --- ICONS ---
        const Icons = {
            LayoutGrid: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>,
            Network: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            GitBranch: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>,
            Brain: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
            Cpu: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>,
            RefreshCw: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>,
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            EyeOff: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        };

        // --- SIDEBAR COMPONENT ---
        const Sidebar = ({ activeView, setActiveView }) => {
            const menuItems = [
                { id: 'dashboard', label: 'Semantic Vault', icon: Icons.LayoutGrid },
                { id: 'graph', label: 'Logic Graph', icon: Icons.Network },
                { id: 'team', label: 'Team Nodes', icon: Icons.Users },
                { id: 'settings', label: 'Vault Settings', icon: Icons.Settings },
            ];

            return (
                <div className="w-64 h-full border-r border-white/5 bg-[#080808] flex flex-col z-20">
                    <div className="p-6">
                            <div className="flex items-center gap-3 mb-8">
                                <div className="w-8 h-8 bg-emerald-500/10 border border-emerald-500/20 rounded-lg flex items-center justify-center text-emerald-500">
                                    <Icons.Shield />
                                </div>
                                <span className="font-bold text-lg tracking-tight">AURA<span className="text-white/30 font-light">/OS</span></span>
                            </div>
                            
                            <div className="mb-6 text-[10px] text-white/40 uppercase tracking-widest pl-4">Naridon, Inc.</div>
                        
                        <div className="space-y-1">
                            {menuItems.map((item) => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveView(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors sidebar-link ${
                                        activeView === item.id ? 'active' : 'text-white/40 hover:text-white'
                                    }`}
                                >
                                    <item.icon />
                                    {item.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="mt-auto p-6 border-t border-white/5">
                        <div className="text-[10px] uppercase tracking-widest text-white/20 font-bold mb-3">Sovereign Node</div>
                        <div className="flex items-center gap-2 text-xs font-mono text-white/60 mb-1">
                            <div className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                            Online (Encrypted)
                        </div>
                        <div className="text-[10px] font-mono text-white/30 truncate">ID: node_8f42a1...</div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD VIEW ---
        const CheckpointList = ({ checkpoints }) => (
            <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                {checkpoints.map(cp => (
                    <div key={cp.id} className="glass-panel glass-panel-hover rounded-xl p-5 transition-all duration-300 group">
                        <div className="flex justify-between items-start mb-4">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center text-emerald-500/80 group-hover:text-emerald-400 group-hover:scale-105 transition-all">
                                    <Icons.GitBranch />
                                </div>
                                <div>
                                    <h3 className="font-medium text-white text-sm tracking-wide">{cp.agent_id}</h3>
                                    <p className="text-[10px] text-white/40 font-mono mt-0.5">{new Date(cp.timestamp).toLocaleTimeString()}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="font-mono text-[9px] text-white/20 bg-white/5 px-1.5 py-0.5 rounded border border-white/5">
                                    {cp.id.substring(0,6)}
                                </div>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <div className="bg-black/40 rounded-lg p-3 border border-white/5">
                                <div className="text-[9px] font-bold text-emerald-500/60 uppercase tracking-widest mb-1.5 flex items-center gap-1.5">
                                    <Icons.Brain />
                                    Intent
                                </div>
                                <p className="text-white/70 text-xs leading-relaxed font-light">"{cp.intent}"</p>
                            </div>

                            <div className="flex flex-wrap gap-1.5">
                                {cp.ast_nodes.slice(0, 3).map((node, i) => (
                                    <div key={i} className="px-2 py-1 bg-white/[0.02] border border-white/5 rounded text-[10px] text-white/60 font-mono flex items-center gap-1.5">
                                        <span className="text-emerald-500/50">{node.kind}</span>
                                        <span className="opacity-50">|</span>
                                        <span className="truncate max-w-[100px]">{node.identifier || 'Anonymous'}</span>
                                    </div>
                                ))}
                                {cp.ast_nodes.length > 3 && (
                                    <div className="px-2 py-1 text-[10px] text-white/20 italic">+{cp.ast_nodes.length - 3}</div>
                                )}
                            </div>
                        </div>
                    </div>
                ))}
            </div>
        );

        // --- TEAM NODES VIEW ---
        const TeamNodes = () => {
            const [peers, setPeers] = useState([
                { id: 'peer_9a2b', name: 'Muhammed (Local)', role: 'Owner', status: 'online', key: '8f42...a9b1' },
                { id: 'peer_7c3d', name: 'Automated CI', role: 'Validator', status: 'active', key: '7c3d...e2f4' },
                { id: 'peer_1x9y', name: 'Remote Backup', role: 'Storage', status: 'offline', key: '1x9y...z8w0' },
            ]);

            return (
                <div className="space-y-6 animate-in fade-in duration-500">
                    <div className="flex justify-between items-center">
                        <h2 className="text-lg font-bold text-white">Authorized Sovereign Peers</h2>
                        <button className="flex items-center gap-2 px-3 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-lg text-xs text-emerald-400 font-medium transition-colors">
                            <Icons.Plus /> Add Peer Node
                        </button>
                    </div>

                    <div className="glass-panel rounded-xl overflow-hidden">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-white/5 text-white/40 font-mono text-xs uppercase">
                                <tr>
                                    <th className="px-6 py-3">Node Identity</th>
                                    <th className="px-6 py-3">Role</th>
                                    <th className="px-6 py-3">Status</th>
                                    <th className="px-6 py-3 text-right">Public Key Fingerprint</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-white/5">
                                {peers.map(peer => (
                                    <tr key={peer.id} className="hover:bg-white/[0.02] transition-colors">
                                        <td className="px-6 py-4">
                                            <div className="font-medium text-white">{peer.name}</div>
                                            <div className="text-[10px] text-white/30 font-mono">{peer.id}</div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <span className="px-2 py-0.5 rounded bg-white/5 border border-white/10 text-xs text-white/60">
                                                {peer.role}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="flex items-center gap-2">
                                                <div className={`w-1.5 h-1.5 rounded-full ${peer.status === 'online' ? 'bg-emerald-500 animate-pulse' : peer.status === 'active' ? 'bg-blue-500' : 'bg-red-500'}`}></div>
                                                <span className="text-white/40 capitalize">{peer.status}</span>
                                            </div>
                                        </td>
                                        <td className="px-6 py-4 text-right font-mono text-xs text-white/30">
                                            {peer.key}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- SETTINGS VIEW ---
        const SettingsView = () => (
            <div className="max-w-2xl space-y-8 animate-in fade-in duration-500">
                <div>
                    <h2 className="text-lg font-bold text-white mb-6">Vault Configuration</h2>
                    
                    <div className="space-y-4">
                        <div className="glass-panel rounded-xl p-6 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="p-2 rounded-lg bg-red-500/10 text-red-400">
                                    <Icons.EyeOff />
                                </div>
                                <div>
                                    <div className="font-medium text-white">Neural Intent Redaction</div>
                                    <div className="text-xs text-white/40">Automatically scrub PII/Secrets from embedding vectors</div>
                                </div>
                            </div>
                            <div className="w-10 h-5 bg-emerald-500 rounded-full relative cursor-pointer">
                                <div className="absolute right-1 top-1 w-3 h-3 bg-white rounded-full shadow-sm"></div>
                            </div>
                        </div>

                        <div className="glass-panel rounded-xl p-6 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="p-2 rounded-lg bg-blue-500/10 text-blue-400">
                                    <Icons.Trash2 />
                                </div>
                                <div>
                                    <div className="font-medium text-white">Semantic Compaction (GC)</div>
                                    <div className="text-xs text-white/40">Prune implicit micro-checkpoints older than 7 days</div>
                                </div>
                            </div>
                            <button className="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs font-medium transition-colors">
                                Run GC Now
                            </button>
                        </div>

                         <div className="glass-panel rounded-xl p-6 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="p-2 rounded-lg bg-yellow-500/10 text-yellow-400">
                                    <Icons.Key />
                                </div>
                                <div>
                                    <div className="font-medium text-white">Encryption Keys</div>
                                    <div className="text-xs text-white/40">Manage AES-256-GCM rotation</div>
                                </div>
                            </div>
                            <button className="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs font-medium transition-colors">
                                Rotate Keys
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP ---
        function App() {
            const [activeView, setActiveView] = useState('dashboard');
            const [checkpoints, setCheckpoints] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const fetchData = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch('/api/checkpoints');
                    if (!res.ok) throw new Error("Sync failed.");
                    const data = await res.json();
                    setCheckpoints(data);
                } catch (err) {
                    setError(err.message);
                    // MOCK DATA ON ERROR FOR PREVIEW
                    setCheckpoints([
                        { id: 'cp_1', agent_id: 'User', timestamp: Date.now(), intent: 'Refactor auth middleware to use semantic config loader', ast_nodes: [{kind: 'Function', identifier: 'validate_session'}, {kind: 'Class', identifier: 'AuthConfig'}] },
                        { id: 'cp_2', agent_id: 'Cursor', timestamp: Date.now() - 3600000, intent: 'Optimized database query in payment processor', ast_nodes: [{kind: 'Method', identifier: 'process_payment'}, {kind: 'Query', identifier: 'SELECT_TAX'}] },
                        { id: 'cp_3', agent_id: 'Aider', timestamp: Date.now() - 7200000, intent: 'Fixed security vulnerability in input sanitization', ast_nodes: [{kind: 'Function', identifier: 'sanitize_input'}, {kind: 'Regex', identifier: 'XSS_PATTERN'}] },
                    ]);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            return (
                <>
                    <Sidebar activeView={activeView} setActiveView={setActiveView} />
                    
                    <main className="flex-1 h-full overflow-y-auto p-8 md:p-12 relative">
                        {/* Top Bar */}
                        <div className="flex justify-between items-center mb-10">
                            <div>
                                <h1 className="text-2xl font-bold text-white mb-1">
                                    {activeView === 'dashboard' && 'Semantic Vault'}
                                    {activeView === 'graph' && 'Logic Graph'}
                                    {activeView === 'team' && 'Team Management'}
                                    {activeView === 'settings' && 'System Settings'}
                                </h1>
                                <p className="text-white/30 text-xs font-mono">
                                    WORKSPACE: /Users/muhammed/Documents/New Git
                                </p>
                            </div>
                            <div className="flex gap-3">
                                <button 
                                    onClick={fetchData}
                                    className="flex items-center gap-2 px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs font-medium transition-colors text-white/60 hover:text-white"
                                >
                                    <span className={loading ? "animate-spin" : ""}><Icons.RefreshCw /></span>
                                    Sync
                                </button>
                            </div>
                        </div>

                        {/* Views */}
                        {activeView === 'dashboard' && (
                            <>
                                {/* Stats Row */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                    <div className="glass-panel rounded-xl p-4">
                                        <div className="text-white/40 text-[10px] uppercase font-bold tracking-widest mb-1">Total Snapshots</div>
                                        <div className="text-2xl font-mono text-white">{checkpoints.length}</div>
                                    </div>
                                    <div className="glass-panel rounded-xl p-4">
                                        <div className="text-white/40 text-[10px] uppercase font-bold tracking-widest mb-1">Logic Nodes</div>
                                        <div className="text-2xl font-mono text-emerald-500">
                                            {checkpoints.reduce((acc, cp) => acc + (cp.ast_nodes?.length || 0), 0)}
                                        </div>
                                    </div>
                                    <div className="glass-panel rounded-xl p-4">
                                        <div className="text-white/40 text-[10px] uppercase font-bold tracking-widest mb-1">Vault Size</div>
                                        <div className="text-2xl font-mono text-blue-500">2.4 MB</div>
                                    </div>
                                </div>

                                <CheckpointList checkpoints={checkpoints} />
                            </>
                        )}

                        {activeView === 'team' && <TeamNodes />}
                        
                        {activeView === 'settings' && <SettingsView />}

                        {activeView === 'graph' && (
                            <div className="flex items-center justify-center h-[400px] glass-panel rounded-xl border-dashed">
                                <div className="text-center">
                                    <div className="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center text-white/20 mx-auto mb-4">
                                        <Icons.Network />
                                    </div>
                                    <h3 className="text-white/50 font-medium">Graph Visualization</h3>
                                    <p className="text-white/20 text-xs mt-2">Rendering logic nodes...</p>
                                </div>
                            </div>
                        )}
                    </main>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
