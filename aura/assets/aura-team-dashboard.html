<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Team Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background-color: #0A0A0A; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(90deg, #60A5FA, #34D399);
        }
        .card-hover:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        /* Custom Scrollbar for dark mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0A; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Lucide Icon Component wrapper for React without a bundler
        const Icon = ({ name, className }) => {
            const iconRef = React.useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    // Create the icon HTML manually to avoid React DOM conflicts
                    const iconNode = lucide.icons[name];
                    if (iconNode) {
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                        svg.setAttribute("width", "24");
                        svg.setAttribute("height", "24");
                        svg.setAttribute("viewBox", "0 0 24 24");
                        svg.setAttribute("fill", "none");
                        svg.setAttribute("stroke", "currentColor");
                        svg.setAttribute("stroke-width", "2");
                        svg.setAttribute("stroke-linecap", "round");
                        svg.setAttribute("stroke-linejoin", "round");
                        if (className) svg.setAttribute("class", className);
                        
                        // Insert children
                        iconNode[2].forEach(child => {
                            const el = document.createElementNS("http://www.w3.org/2000/svg", child[0]);
                            if (child[1]) {
                                for (const [k, v] of Object.entries(child[1])) {
                                    el.setAttribute(k, v);
                                }
                            }
                            svg.appendChild(el);
                        });

                        // Safely clear and append to prevent React reconciliation issues
                        while (iconRef.current.firstChild) {
                            iconRef.current.removeChild(iconRef.current.firstChild);
                        }
                        iconRef.current.appendChild(svg);
                    }
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const Badge = ({ children, color = "blue" }) => {
            const colors = {
                blue: "bg-blue-500/10 text-blue-400 border-blue-500/20",
                emerald: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
                purple: "bg-purple-500/10 text-purple-400 border-purple-500/20",
                orange: "bg-orange-500/10 text-orange-400 border-orange-500/20",
                red: "bg-red-500/10 text-red-400 border-red-500/20",
            };
            return (
                <div className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md border text-[10px] font-mono font-bold tracking-wider uppercase ${colors[color]}`}>
                    {children}
                </div>
            );
        };

        function App() {
            const [repo, setRepo] = useState('muhammed/new-git-aura');
            const [token, setToken] = useState('');
            const [checkpoints, setCheckpoints] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [view, setView] = useState('feed'); // 'feed' or 'graph'

            const fetchCheckpoints = async (e) => {
                if (e) e.preventDefault();
                setLoading(true);
                setError(null);
                try {
                    // Try Local API
                    try {
                        const localRes = await fetch('/api/checkpoints');
                        if (localRes.ok) {
                            const localData = await localRes.json();
                            localData.sort((a, b) => b.timestamp - a.timestamp);
                            setCheckpoints(localData);
                            setLoading(false);
                            return;
                        }
                    } catch (e) {
                        console.log("Local API not available, falling back to GitHub");
                    }

                    // Fallback to GitHub Remote API
                    if (!repo) throw new Error("Please enter a repository name.");

                    const headers = token ? { Authorization: `token ${token}` } : {};
                    const branchRes = await fetch(`https://api.github.com/repos/${repo}/git/trees/aura/checkpoints/v1?recursive=1`, { headers });
                    
                    if (!branchRes.ok) {
                        if (branchRes.status === 404) throw new Error("Could not find aura/checkpoints/v1 branch on remote.");
                        throw new Error(`GitHub API Error: ${branchRes.statusText}`);
                    }
                    
                    const treeData = await branchRes.json();
                    const jsonFiles = treeData.tree.filter(file => file.path.endsWith('.json'));

                    const cpData = await Promise.all(jsonFiles.map(async (file) => {
                        const blobRes = await fetch(file.url, { headers });
                        const blobData = await blobRes.json();
                        return JSON.parse(atob(blobData.content));
                    }));

                    cpData.sort((a, b) => b.timestamp - a.timestamp);
                    setCheckpoints(cpData);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchCheckpoints();
            }, []);

            return (
                <div className="min-h-screen flex">
                    {/* Sidebar */}
                    <div className="w-64 border-r border-white/5 bg-[#050505] p-6 flex flex-col h-screen sticky top-0">
                        <div className="flex items-center gap-3 mb-10">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
                                <Icon name="Brain" className="w-4 h-4 text-white" />
                            </div>
                            <span className="font-bold text-xl tracking-tight">Aura</span>
                        </div>

                        <nav className="space-y-2 mb-auto">
                            <button onClick={() => setView('feed')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${view === 'feed' ? 'bg-white/10 text-white' : 'text-white/50 hover:bg-white/5 hover:text-white'}`}>
                                <Icon name="Activity" className="w-4 h-4" />
                                Semantic Feed
                            </button>
                            <button onClick={() => setView('graph')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${view === 'graph' ? 'bg-white/10 text-white' : 'text-white/50 hover:bg-white/5 hover:text-white'}`}>
                                <Icon name="Network" className="w-4 h-4" />
                                Merkle Graph
                            </button>
                            <button className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/50 hover:bg-white/5 hover:text-white transition-colors">
                                <Icon name="Shield" className="w-4 h-4" />
                                Gatekeeper
                            </button>
                        </nav>

                        <div className="mt-8">
                            <div className="text-xs font-semibold text-white/30 uppercase tracking-widest mb-4">Remote Sync</div>
                            <form onSubmit={fetchCheckpoints} className="space-y-3">
                                <div>
                                    <input type="text" value={repo} onChange={e => setRepo(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-md px-3 py-2 text-xs text-white/80 focus:outline-none focus:border-blue-500 transition-colors" placeholder="owner/repo" />
                                </div>
                                <div>
                                    <input type="password" value={token} onChange={e => setToken(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-md px-3 py-2 text-xs text-white/80 focus:outline-none focus:border-blue-500 transition-colors" placeholder="GitHub Token" />
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-white/10 hover:bg-white/20 text-white font-medium py-2 rounded-md text-xs transition-colors flex items-center justify-center gap-2">
                                    {loading ? <div className="w-3 h-3 rounded-full border-2 border-white/30 border-t-white animate-spin" /> : <Icon name="RefreshCw" className="w-3 h-3" />}
                                    Sync Brain
                                </button>
                            </form>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 overflow-auto bg-[#0A0A0A]">
                        <header className="h-16 border-b border-white/5 flex items-center justify-between px-8 sticky top-0 bg-[#0A0A0A]/80 backdrop-blur-md z-10">
                            <h1 className="font-semibold text-white/90">
                                {view === 'feed' ? 'Recent Architectural Decisions' : 'Global Dependency Graph'}
                            </h1>
                            <div className="flex items-center gap-2 text-xs text-white/40">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                Live Sync Active
                            </div>
                        </header>

                        <main className="p-8 max-w-5xl mx-auto">
                            {error && (
                                <div className="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl mb-8 flex items-start gap-3">
                                    <Icon name="AlertCircle" className="w-5 h-5 shrink-0 mt-0.5" />
                                    <div className="text-sm">{error}</div>
                                </div>
                            )}

                            {view === 'feed' && (
                                <div className="space-y-6 relative">
                                    {/* Timeline Line */}
                                    <div className="absolute left-8 top-4 bottom-0 w-[1px] bg-white/5 z-0"></div>

                                    {checkpoints.map(cp => {
                                        // Determine badge color based on agent type
                                        let agentColor = "blue";
                                        let agentIcon = "Terminal";
                                        let isVerified = cp.agent_id.toLowerCase().includes('mcp');

                                        if cp.agent_id.toLowerCase().includes('cursor') { agentColor = "purple"; agentIcon = "Box"; }
                                        else if cp.agent_id.toLowerCase().includes('daemon') { agentColor = "emerald"; agentIcon = "Activity"; }
                                        else if cp.agent_id.toLowerCase().includes('aider') { agentColor = "orange"; agentIcon = "Bot"; }

                                        return (
                                            <div key={cp.id} className="relative z-10 pl-20">
                                                {/* Timeline Dot */}
                                                <div className="absolute left-[31px] top-6 w-3 h-3 rounded-full bg-[#0A0A0A] border-2 border-white/20"></div>

                                                <div className="glass-panel rounded-2xl overflow-hidden card-hover transition-all duration-300">
                                                    <div className="p-5 border-b border-white/5 flex items-center justify-between bg-white/[0.01]">
                                                        <div className="flex items-center gap-4">
                                                            <Badge color={agentColor}>
                                                                <Icon name={agentIcon} className="w-3 h-3 mr-1 inline" />
                                                                {cp.agent_id}
                                                            </Badge>
                                                            {isVerified ? (
                                                                <span className="text-[9px] font-bold text-blue-400 bg-blue-400/10 px-1.5 py-0.5 rounded border border-blue-400/20 uppercase tracking-tighter">Verified</span>
                                                            ) : (
                                                                <span className="text-[9px] font-bold text-orange-400 bg-orange-400/10 px-1.5 py-0.5 rounded border border-orange-400/20 uppercase tracking-tighter">Heuristic Scrape</span>
                                                            )}
                                                            <span className="text-xs text-white/40 font-mono">
                                                                {new Date(cp.timestamp).toLocaleString()}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            {cp.env_fingerprint && (
                                                                <div className="text-[10px] font-mono text-white/30 flex items-center gap-1" title="Environment State">
                                                                    <Icon name="Fingerprint" className="w-3 h-3" />
                                                                    {cp.env_fingerprint.substring(0,8)}
                                                                </div>
                                                            )}
                                                            <code className="text-[10px] text-blue-400/70 bg-blue-400/10 px-2 py-1 rounded font-medium">
                                                                {cp.id.substring(0,8)}
                                                            </code>
                                                        </div>
                                                    </div>

                                                    <div className="p-6">
                                                        <div className="mb-6">
                                                            <p className="text-sm text-white/80 leading-relaxed whitespace-pre-wrap">{cp.intent}</p>
                                                        </div>

                                                        {cp.ast_nodes && cp.ast_nodes.length > 0 && (
                                                            <div>
                                                                <div className="flex items-center gap-2 text-xs font-semibold text-white/30 uppercase tracking-widest mb-3">
                                                                    <Icon name="Layers" className="w-3 h-3" />
                                                                    Modified AST Nodes ({cp.ast_nodes.length})
                                                                </div>
                                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                                    {cp.ast_nodes.map((node, i) => (
                                                                        <div key={i} className="bg-black/40 border border-white/5 rounded-lg p-3">
                                                                            <div className="flex justify-between items-start mb-2">
                                                                                <span className="font-mono text-xs text-emerald-400 font-semibold truncate pr-2">
                                                                                    {node.identifier || 'anonymous_block'}
                                                                                </span>
                                                                                <span className="text-[9px] uppercase tracking-wider text-white/30 bg-white/5 px-1.5 py-0.5 rounded">
                                                                                    {(node.kind || '').replace('_', ' ')}
                                                                                </span>
                                                                            </div>
                                                                            
                                                                            <div className="flex items-center gap-2 mb-2">
                                                                                <div className="h-1 flex-1 bg-white/5 rounded-full overflow-hidden">
                                                                                    <div 
                                                                                        className={`h-full ${node.confidence > 0.9 ? 'bg-emerald-500' : 'bg-orange-500'}`} 
                                                                                        style={{ width: `${(node.confidence || 1.0) * 100}%` }}
                                                                                    ></div>
                                                                                </div>
                                                                                <span className="text-[8px] font-mono text-white/30">
                                                                                    {Math.round((node.confidence || 1.0) * 100)}% Match
                                                                                </span>
                                                                            </div>
                                                                            
                                                                            {node.contains_secret && (
                                                                                <div className="mb-2 inline-flex items-center gap-1 text-[10px] text-red-400 bg-red-400/10 px-1.5 py-0.5 rounded font-bold uppercase tracking-wider">
                                                                                    <Icon name="AlertTriangle" className="w-3 h-3" />
                                                                                    Secret Detected
                                                                                </div>
                                                                            )}

                                                                            <div className="text-[10px] font-mono text-white/20 truncate mb-2">
                                                                                {node.node_id || (node.content_hash ? node.content_hash.substring(0,12) : '')}
                                                                            </div>

                                                                            {node.dependencies && node.dependencies.length > 0 && (
                                                                                <div className="mt-2 pt-2 border-t border-white/5">
                                                                                    <div className="text-[9px] text-white/30 uppercase tracking-wider mb-1.5">Dependencies</div>
                                                                                    <div className="flex flex-wrap gap-1.5">
                                                                                        {node.dependencies.map((d, j) => {
                                                                                            const isExternal = typeof d === 'object' && d.uri;
                                                                                            const name = typeof d === 'object' ? d.name : d;
                                                                                            return (
                                                                                                <span key={j} className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${isExternal ? 'border-purple-500/30 text-purple-400 bg-purple-500/10' : 'border-white/10 text-white/50 bg-white/5'}`}>
                                                                                                    {name}
                                                                                                </span>
                                                                                            );
                                                                                        })}
                                                                                    </div>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {view === 'graph' && (
                                <div className="text-center py-20">
                                    <div className="w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mx-auto mb-6">
                                        <Icon name="Network" className="w-8 h-8 text-white/20" />
                                    </div>
                                    <h2 className="text-xl font-semibold text-white/80 mb-2">Interactive Merkle-Graph</h2>
                                    <p className="text-sm text-white/40 mb-8 max-w-md mx-auto">
                                        The visual dependency graph is compiled locally via Graphviz. Run <code className="bg-white/10 px-1 py-0.5 rounded text-emerald-400">aura map</code> in your terminal to generate the DOT file.
                                    </p>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return <div className="p-8 text-red-400 bg-red-900/20 border border-red-500/20 rounded-xl m-8">
                        <h1 className="text-xl font-bold mb-2">Dashboard Render Error</h1>
                        <pre className="text-sm overflow-auto opacity-80">{this.state.error.toString()}</pre>
                    </div>;
                }
                return this.props.children;
            }
        }

        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
