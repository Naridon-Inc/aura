name: Release Aura CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable_name: aura
            asset_name: aura-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            executable_name: aura
            asset_name: aura-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            executable_name: aura
            asset_name: aura-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            executable_name: aura
            asset_name: aura-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_name: aura.exe
            asset_name: aura-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        working-directory: ./aura
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: aura/target/${{ matrix.target }}/release/${{ matrix.executable_name }}
          name: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
