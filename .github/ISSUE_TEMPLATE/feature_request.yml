name: Feature request
description: Something Aura should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do, and where does Aura get in the way today? Describe
        the situation rather than the feature — it often turns out there is a shorter
        route to the same place.
      placeholder: |
        I review agent commits across four repositories. To see which ones deleted a
        public symbol I have to open each one and run aura why by hand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: If you already know the shape of the answer, describe it. A command line is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, if there is one. It tells us how much this costs you.
