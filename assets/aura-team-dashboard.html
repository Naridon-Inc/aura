<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Team Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'JetBrains Mono', monospace;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        
        .block-border {
            border: 2px solid #222;
        }
        
        .block-card {
            background-color: #000;
            border: 2px solid #222;
        }
        
        .block-card:hover {
            border-color: #555;
            background-color: #050505;
        }
        
        .sidebar {
            background-color: #000;
            border-right: 2px solid #222;
        }
        
        .btn-primary {
            background-color: #fff;
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            border: 2px solid #fff;
            transition: all 0.1s ease;
        }
        
        .btn-primary:hover {
            background-color: #000;
            color: #fff;
        }
        
        .btn-secondary {
            background-color: #000;
            color: #888;
            font-weight: 700;
            text-transform: uppercase;
            border: 2px solid #222;
            transition: all 0.1s ease;
        }
        
        .btn-secondary:hover {
            border-color: #555;
            color: #fff;
        }
        
        .btn-active {
            background-color: #fff;
            color: #000;
            border-color: #fff;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .terminal-text {
            line-height: 1.4;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className }) => {
            const iconRef = React.useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    const lucideName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                    const iconNode = lucide.icons[name] || lucide.icons[lucideName];
                    
                    if (iconNode) {
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                        svg.setAttribute("width", "24");
                        svg.setAttribute("height", "24");
                        svg.setAttribute("viewBox", "0 0 24 24");
                        svg.setAttribute("fill", "none");
                        svg.setAttribute("stroke", "currentColor");
                        svg.setAttribute("stroke-width", "2.5");
                        svg.setAttribute("stroke-linecap", "square");
                        svg.setAttribute("stroke-linejoin", "miter");
                        if (className) svg.setAttribute("class", className);
                        
                        const children = iconNode[2] || [];
                        children.forEach(child => {
                            const el = document.createElementNS("http://www.w3.org/2000/svg", child[0]);
                            if (child[1]) {
                                for (const [k, v] of Object.entries(child[1])) {
                                    el.setAttribute(k, v);
                                }
                            }
                            svg.appendChild(el);
                        });

                        while (iconRef.current.firstChild) {
                            iconRef.current.removeChild(iconRef.current.firstChild);
                        }
                        iconRef.current.appendChild(svg);
                    }
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const Badge = ({ children, color = "zinc" }) => {
            const colors = {
                zinc: "border-zinc-800 text-zinc-500",
                blue: "border-blue-800 text-blue-500",
                emerald: "border-emerald-800 text-emerald-500",
                purple: "border-purple-800 text-purple-500",
                orange: "border-orange-800 text-orange-500",
                red: "border-red-800 text-red-500",
            };
            return (
                <div className={`px-2 py-0.5 border text-[10px] font-extrabold uppercase tracking-widest ${colors[color]}`}>
                    {children}
                </div>
            );
        };

        function App() {
            const [checkpoints, setCheckpoints] = useState([]);
            const [view, setView] = useState('feed');
            const [loading, setLoading] = useState(false);

            const fetchCheckpoints = async () => {
                setLoading(true);
                try {
                    const res = await fetch('/api/checkpoints');
                    if (res.ok) {
                        const data = await res.json();
                        
                        // Filter out implicit background scans to keep UX focused on explicit intent
                        const explicitData = data.filter(cp => 
                            !cp.intent.startsWith('Automatically tracked') && 
                            !cp.intent.startsWith('No semantic logic changes')
                        );
                        
                        explicitData.sort((a, b) => b.timestamp - a.timestamp);
                        setCheckpoints(explicitData);
                    }
                } catch (e) {
                    console.error("Aura Daemon offline", e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchCheckpoints(); }, []);

            return (
                <div className="flex h-screen w-full">
                    {/* LEFT SIDEBAR */}
                    <aside className="w-72 sidebar p-8 flex flex-col">
                        <div className="mb-12">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-8 h-8 bg-white flex items-center justify-center">
                                    <Icon name="Zap" className="w-5 h-5 text-black" />
                                </div>
                                <span className="text-2xl font-black tracking-tighter uppercase italic">AURA</span>
                            </div>
                            <div className="text-[10px] font-bold text-zinc-600 tracking-[0.2em] uppercase">Semantic Controller</div>
                        </div>

                        <nav className="space-y-2 flex-1">
                            {[
                                { id: 'feed', icon: 'Activity', label: 'Semantic Feed' },
                                { id: 'gatekeeper', icon: 'ShieldCheck', label: 'Gatekeeper' },
                                { id: 'graph', icon: 'Network', label: 'Merkle Graph' },
                                { id: 'settings', icon: 'Settings', label: 'Config' }
                            ].map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setView(item.id)}
                                    className={`w-full flex items-center gap-4 px-4 py-3 text-xs font-black uppercase tracking-wider transition-all border-2 ${view === item.id ? 'bg-white text-black border-white' : 'text-zinc-500 border-transparent hover:border-zinc-800 hover:text-white'}`}
                                >
                                    <Icon name={item.icon} className="w-4 h-4" />
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <div className="mt-8 pt-8 border-t-2 border-zinc-900">
                            <div className="space-y-4">
                                <div className="p-4 block-card">
                                    <div className="text-[9px] font-black text-zinc-700 uppercase mb-2">System Version</div>
                                    <div className="text-xs font-bold text-white">AURA_OS v0.2.2</div>
                                </div>
                                <button onClick={fetchCheckpoints} className="w-full btn-secondary py-3 text-xs">
                                    SYNC_SYSTEM
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 overflow-auto flex flex-col bg-black">
                        {/* TOP BAR */}
                        <header className="h-20 border-b-2 border-zinc-900 flex items-center justify-between px-10 shrink-0">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 bg-emerald-500 rounded-none animate-pulse"></div>
                                    <span className="text-[10px] font-black uppercase tracking-widest text-emerald-500">DAEMON_ONLINE</span>
                                </div>
                                <div className="h-4 w-[1px] bg-zinc-800"></div>
                                <div className="text-[10px] font-black uppercase tracking-widest text-zinc-500">
                                    STRICT_MODE: <span className="text-red-500">BLOCKING</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="text-[10px] font-black text-zinc-600 uppercase">Local_Node: 127.0.0.1:8090</div>
                            </div>
                        </header>

                        {/* CONTENT VIEW */}
                        <div className="flex-1 p-10 max-w-5xl w-full mx-auto">
                            {view === 'feed' && (
                                <div className="space-y-8">
                                    {checkpoints.length === 0 && !loading && (
                                        <div className="p-20 border-2 border-dashed border-zinc-900 text-center">
                                            <Icon name="Inbox" className="w-10 h-10 text-zinc-800 mb-4 mx-auto" />
                                            <div className="text-xs font-black text-zinc-700 uppercase tracking-widest">No semantic checkpoints found</div>
                                        </div>
                                    )}

                                    {checkpoints.map(cp => {
                                        let agentColor = "zinc";
                                        let agentIcon = "User";
                                        const agentId = cp.agent_id || "Unknown";
                                        
                                        if (agentId.toLowerCase().includes('cursor')) { agentColor = "purple"; agentIcon = "Box"; }
                                        else if (agentId.toLowerCase().includes('daemon')) { agentColor = "emerald"; agentIcon = "Activity"; }
                                        else if (agentId.toLowerCase().includes('aider')) { agentColor = "orange"; agentIcon = "Bot"; }
                                        else if (agentId.toLowerCase().includes('mcp')) { agentColor = "blue"; agentIcon = "Cpu"; }

                                        return (
                                            <div key={cp.id} className="block-border p-8 space-y-6 relative group transition-colors hover:border-zinc-700">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`p-2 border-2 ${agentColor === 'purple' ? 'border-purple-900 text-purple-500' : agentColor === 'emerald' ? 'border-emerald-900 text-emerald-500' : agentColor === 'blue' ? 'border-blue-900 text-blue-500' : 'border-zinc-800 text-zinc-500'}`}>
                                                            <Icon name={agentIcon} className="w-4 h-4" />
                                                        </div>
                                                        <div>
                                                            <div className="text-[11px] font-black text-white uppercase tracking-wider">{agentId}</div>
                                                            <div className="text-[9px] font-bold text-zinc-600 uppercase mt-0.5">
                                                                {new Date(cp.timestamp).toLocaleString()}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="text-[9px] font-bold text-zinc-800 font-mono tracking-tighter">
                                                        SEQ_ID: {cp.id.substring(0,12)}
                                                    </div>
                                                </div>

                                                <div className="pl-6 border-l-4 border-zinc-900">
                                                    <p className="text-sm font-bold text-zinc-300 leading-relaxed tracking-tight">
                                                        "{cp.intent}"
                                                    </p>
                                                </div>

                                                {cp.ast_nodes && cp.ast_nodes.length > 0 && (
                                                    <div className="bg-zinc-950/30 border border-zinc-900 p-4 mt-4 flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <div className="p-2 bg-zinc-900">
                                                                <Icon name="Code" className="w-4 h-4 text-zinc-400" />
                                                            </div>
                                                            <div>
                                                                <div className="text-xs font-bold text-white tracking-wide">Architectural Impact</div>
                                                                <div className="text-[10px] text-zinc-500 mt-1">Mathematically verified {cp.ast_nodes.length} logic nodes across the codebase.</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-1">Gatekeeper Status</div>
                                                            <div className="inline-flex items-center gap-1.5 px-2 py-1 bg-emerald-950/30 border border-emerald-900/50 text-[9px] font-bold text-emerald-500 uppercase tracking-wider">
                                                                <Icon name="CheckCircle2" className="w-3 h-3" />
                                                                Verified
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {view === 'gatekeeper' && (
                                <div className="space-y-10">
                                    <div className="block-border p-10 bg-zinc-950/20">
                                        <div className="flex items-start justify-between mb-8">
                                            <div>
                                                <h2 className="text-3xl font-black text-white uppercase tracking-tighter mb-4 italic">Gatekeeper Security</h2>
                                                <p className="text-xs font-bold text-zinc-500 max-w-xl leading-relaxed uppercase">
                                                    Aura's Gatekeeper enforces semantic integrity. It blocks commits where code modifications do not align with natural language intent or contain unverified secrets.
                                                </p>
                                            </div>
                                            <div className="px-6 py-2 border-4 border-red-900 text-red-500 font-black italic uppercase tracking-[0.2em]">
                                                STRICT_ON
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-3 gap-6">
                                            <div className="block-card p-6">
                                                <div className="text-[10px] font-black text-zinc-700 uppercase mb-3">Logic Verification</div>
                                                <div className="text-xl font-black text-white italic tracking-tighter uppercase">MATHEMATICAL</div>
                                                <div className="text-[9px] font-bold text-zinc-500 mt-2">Intent Alignment Active</div>
                                            </div>
                                            <div className="block-card p-6">
                                                <div className="text-[10px] font-black text-zinc-700 uppercase mb-3">Secret Sentinel</div>
                                                <div className="text-xl font-black text-red-600 italic tracking-tighter uppercase">BLOCKING</div>
                                                <div className="text-[9px] font-bold text-zinc-500 mt-2">High-Entropy Detection</div>
                                            </div>
                                            <div className="block-card p-6">
                                                <div className="text-[10px] font-black text-zinc-700 uppercase mb-3">Bypass Prevention</div>
                                                <div className="text-xl font-black text-emerald-500 italic tracking-tighter uppercase">IMMUTABLE</div>
                                                <div className="text-[9px] font-bold text-zinc-500 mt-2">Git Hook Enforcement</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-10">
                                        <div className="space-y-4">
                                            <h3 className="text-xs font-black text-zinc-600 uppercase tracking-widest">Protected Components</h3>
                                            <div className="space-y-2">
                                                {['GSDEngine', 'SemanticParser', 'AuraRouter', 'CheckpointStore', 'ConfigManager'].map(comp => (
                                                    <div key={comp} className="block-card p-4 flex items-center justify-between">
                                                        <span className="text-xs font-bold text-white uppercase">{comp}</span>
                                                        <Icon name="Lock" className="w-3.5 h-3.5 text-zinc-800" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <h3 className="text-xs font-black text-zinc-600 uppercase tracking-widest">Gatekeeper Controls</h3>
                                            <div className="block-card p-8 space-y-6">
                                                <div className="space-y-2">
                                                    <div className="text-[10px] font-bold text-zinc-500 uppercase">Emergency Override</div>
                                                    <button className="w-full btn-secondary py-3 text-[10px] border-red-900 text-red-900 hover:bg-red-900/10 transition-colors">DISABLE_GATEKEEPER (DANGEROUS)</button>
                                                </div>
                                                <div className="space-y-2">
                                                    <div className="text-[10px] font-bold text-zinc-500 uppercase">Audit Log</div>
                                                    <button className="w-full btn-secondary py-3 text-[10px]">EXPORT_AUDIT_DATA</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {view === 'graph' && (
                                <div className="h-full flex items-center justify-center">
                                    <div className="text-center space-y-8 max-w-md">
                                        <div className="w-20 h-20 bg-zinc-900 border-2 border-zinc-800 flex items-center justify-center mx-auto">
                                            <Icon name="Network" className="w-10 h-10 text-zinc-700" />
                                        </div>
                                        <div className="space-y-4">
                                            <h2 className="text-2xl font-black text-white italic uppercase tracking-tighter">Semantic Merkle Graph</h2>
                                            <p className="text-xs font-bold text-zinc-500 uppercase leading-relaxed">
                                                The Merkle Graph tracks every logic dependency. High-fidelity visualization requires local Graphviz processing.
                                            </p>
                                        </div>
                                        <button className="btn-primary px-10 py-4 text-xs tracking-[0.2em]">GENERATE_DOT_GRAPH</button>
                                        <div className="text-[10px] font-bold text-zinc-700 uppercase tracking-widest mt-10">Run 'aura map' in terminal for raw output</div>
                                    </div>
                                </div>
                            )}

                            {view === 'settings' && (
                                <div className="max-w-2xl mx-auto space-y-12">
                                    <h2 className="text-4xl font-black text-white italic uppercase tracking-tighter">Configuration</h2>
                                    
                                    <div className="space-y-8">
                                        <div className="space-y-4">
                                            <div className="text-[10px] font-black text-zinc-600 uppercase tracking-widest">Aura Behavior</div>
                                            <div className="block-card p-6 flex items-center justify-between">
                                                <div>
                                                    <div className="text-sm font-bold text-white uppercase">Strict Mode</div>
                                                    <div className="text-[9px] font-bold text-zinc-500 uppercase mt-1">Block commits on intent mismatch</div>
                                                </div>
                                                <div className="w-12 h-6 bg-white border-2 border-white"></div>
                                            </div>
                                            <div className="block-card p-6 flex items-center justify-between">
                                                <div>
                                                    <div className="text-sm font-bold text-white uppercase">Neural Indexing</div>
                                                    <div className="text-[9px] font-bold text-zinc-500 uppercase mt-1">Generate Gemini embeddings for nodes</div>
                                                </div>
                                                <div className="w-12 h-6 bg-emerald-500 border-2 border-emerald-500"></div>
                                            </div>
                                        </div>

                                        <div className="space-y-4 pt-6 border-t-2 border-zinc-900">
                                            <div className="text-[10px] font-black text-zinc-600 uppercase tracking-widest">Environment Variables</div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="block-card p-4">
                                                    <div className="text-[9px] font-bold text-zinc-700 uppercase mb-1">Aura_Root</div>
                                                    <div className="text-[10px] font-bold text-zinc-400 truncate">/Users/muhammed/Documents/New Git</div>
                                                </div>
                                                <div className="block-card p-4">
                                                    <div className="text-[9px] font-bold text-zinc-700 uppercase mb-1">Daemon_Port</div>
                                                    <div className="text-[10px] font-bold text-zinc-400">8090</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
