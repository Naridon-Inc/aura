[package]
name = "aura-crdt-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
loro = "0.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["full", "macros"] }
