[package]
name        = "aura-attestation"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0 OR MIT"
description = "ed25519 signing + verification + keyfile management for Aura block provenance."
repository  = "https://github.com/Naridon-Inc/aura"
publish     = false

[dependencies]
aura-blocks   = { path = "../aura-blocks" }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand          = { version = "0.8", features = ["std_rng"] }
base64        = "0.22"
serde         = { version = "1", features = ["derive"] }
serde_bytes   = "0.11"
serde_json    = "1"
thiserror     = "1"
zeroize       = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile      = "3"
time          = { version = "0.3", features = ["serde", "serde-well-known"] }
