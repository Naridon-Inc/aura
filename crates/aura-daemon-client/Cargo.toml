[package]
name        = "aura-daemon-client"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0 OR MIT"
description = "Protocol types + client for the aura-daemon Unix-socket RPC (aura-ipc v1)."
repository  = "https://github.com/Naridon-Inc/aura"
publish     = false

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium    = "0.2"
tokio       = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time", "fs"] }
thiserror   = "1"
uuid        = { version = "1", features = ["v7", "serde"] }
tracing     = "0.1"

[dev-dependencies]
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile    = "3"
