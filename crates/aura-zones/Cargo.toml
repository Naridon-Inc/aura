[package]
name = "aura-zones"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "File and function ownership zones for multi-agent codebases. Mutex for AI agents — claim, detect collisions, coordinate."
repository = "https://github.com/Naridon-Inc/aura-zones"
homepage = "https://auravcs.com"
documentation = "https://docs.rs/aura-zones"
readme = "README.md"
keywords = ["ai-agents", "concurrency", "mutex", "collaboration", "llm"]
categories = ["development-tools", "concurrency"]

[lib]
name = "aura_zones"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.36"
