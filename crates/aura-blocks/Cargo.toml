[package]
name = "aura-blocks"
version = "0.19.21"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Canonical Block envelope, FSM, and append-only op stream for Aura's work surface."
repository = "https://github.com/Naridon-Inc/aura"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
uuid = { version = "1", features = ["v7", "serde"] }

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
