[package]
name        = "aura-repo-identity"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0 OR MIT"
description = "The one rule that turns a checkout on disk into the name Aura Cloud files it under."
repository  = "https://github.com/Naridon-Inc/aura"
publish     = false

[dependencies]
aura-attestation = { path = "../aura-attestation", default-features = false }
sha2             = "0.10"
hex              = "0.4"

[dev-dependencies]
tempfile = "3"
