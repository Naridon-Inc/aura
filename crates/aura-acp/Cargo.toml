[package]
name = "aura-acp"
version = "0.1.0"
edition = "2021"
description = "Aura's one Agent Client Protocol client: JSON-RPC connection (stdio, prepared command, or any byte pipe, optionally resumable), session driver, update model, elicitation and permission helpers, and the ACP Registry. Shared by aura-shell, aura-cli and the cloud box relay so there is exactly one ACP implementation."

[dependencies]
# Spec-exact v1 types, method names and error codes, maintained alongside the
# protocol itself. Types only; transport, dispatch and policy stay ours.
agent-client-protocol-schema = { version = "=1.16.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "rt", "macros", "time"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "process", "sync", "rt", "rt-multi-thread", "macros", "time"] }
tempfile = "3"
