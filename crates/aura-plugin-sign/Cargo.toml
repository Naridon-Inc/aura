[package]
name        = "aura-plugin-sign"
version     = "0.19.21"
edition     = "2024"
license     = "Apache-2.0 OR MIT"
description = "Bundle digest + ed25519 signing/verification + publisher trust store for Aura plugins."
repository  = "https://github.com/Naridon-Inc/aura"
publish     = false

[dependencies]
aura-attestation = { path = "../aura-attestation" }
base64           = "0.22"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
sha2             = "0.10"

[dev-dependencies]
tempfile = "3"
