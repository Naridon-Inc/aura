<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="0.5" stop-color="#161618"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfd4dc"/>
      <stop offset="1" stop-color="#aeb6c2"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <!-- charcoal window -->
  <rect width="660" height="420" fill="url(#bg)"/>

  <!-- soft warm ambient glow bleeding from top + bottom edges (slashspace signature) -->
  <g filter="url(#soft)">
    <ellipse cx="345" cy="6"   rx="225" ry="74" fill="#c06a30" fill-opacity="0.42"/>
    <ellipse cx="330" cy="416" rx="245" ry="66" fill="#b35e22" fill-opacity="0.38"/>
    <ellipse cx="120" cy="70"  rx="120" ry="80" fill="#3b4a7a" fill-opacity="0.20"/>
  </g>

