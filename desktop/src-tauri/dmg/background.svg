<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="0.5" stop-color="#161618"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <!-- charcoal window -->
  <rect width="660" height="420" fill="url(#bg)"/>

  <!-- soft warm ambient glow bleeding from top + bottom edges (slashspace signature) -->
  <g filter="url(#soft)">
    <ellipse cx="345" cy="6"   rx="225" ry="74" fill="#c06a30" fill-opacity="0.42"/>
    <ellipse cx="330" cy="416" rx="245" ry="66" fill="#b35e22" fill-opacity="0.38"/>
    <ellipse cx="120" cy="70"  rx="120" ry="80" fill="#3b4a7a" fill-opacity="0.20"/>
  </g>

  <!-- subtle lockup, lower-left: mark badge + wordmark -->
  <g transform="translate(40,182)">
    <rect x="0" y="0" width="25" height="25" rx="7.5" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
    <!-- The binary-box mark, same geometry the app icon and the in-app
         topbar use (src/components/AuraMark.tsx is the source of truth
         for the glyph). The desktop component punches the two eyes with
         a <mask>; here they are even-odd subpaths of the body and the
         "0" is a stroked path, so the mark is three plain <path>s with
         no mask and no <defs> — cairosvg drops the mask silently and
         would ship a blank box with no eyes at all. Natural extent is
         102 x 76.4, scaled to ~17.5px and centred in the 25px badge. -->
    <g transform="translate(3.58,5.81) scale(0.1716)" fill="#e7eaf0">
      <path fill-rule="evenodd" d="M 10 11 C 5 12 1 16 1 21 L 1 55 C 1 57 2 58 4 59 L 39 76 C 42 77.2 46 77 49 75 C 59 72 78 66 90 62 C 96 60 101 56 103 48 L 103 25 C 103 22 102 19 98 17 C 85 13 69 7 53 2 C 50 1.1 47 0.8 44 1 L 10 11 Z M 64.317 52.536 C 61.897 62.29 54.235 68.782 47.202 67.038 C 40.169 65.293 36.429 55.972 38.849 46.218 C 41.269 36.464 48.931 29.972 55.964 31.716 C 62.997 33.461 66.737 42.782 64.317 52.536 Z M 98.767 40.769 C 97.277 49.764 90.944 56.206 84.621 55.159 C 78.299 54.112 74.381 45.971 75.871 36.977 C 77.361 27.982 83.694 21.54 90.017 22.587 C 96.339 23.634 100.257 31.775 98.767 40.769 Z"/>
      <!-- the "1" -->
      <path d="M 48.4 46 L 52.7 41.4 H 55.6 V 58.8 H 51.1 V 47.2 L 48.4 49.2 Z"/>
      <!-- the "0" — a ring, so the hole reads as a zero -->
      <path fill="none" stroke="#e7eaf0" stroke-width="3.6" d="M 94.405 40.02 C 93.466 45.687 89.569 49.761 85.701 49.12 C 81.832 48.479 79.457 43.366 80.395 37.7 C 81.334 32.033 85.231 27.959 89.099 28.6 C 92.968 29.241 95.343 34.354 94.405 40.02 Z"/>
    </g>
    <text x="34" y="18" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="16.5" font-weight="600" letter-spacing="0.2" fill="#f0f1f4">Aura</text>
  </g>

  <!-- two lines of plain-language install text -->
  <text x="40" y="244" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="400" fill="#9097a0">Drag Aura into your Applications folder.</text>
  <text x="40" y="264" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="400" fill="#676d76">Then open it from Launchpad or Spotlight.</text>

  <!-- footer: copyright + version -->
  <text x="40" y="398" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="400" fill="#565b63">© 2026 Naridon, Inc</text>
  <!-- Stamped by scripts/build-dmg-background.sh from package.json. Do not
       hand-edit: it read v0.19.0 for twelve releases because nothing kept
       it honest. -->
  <text id="dmg-version" x="620" y="398" text-anchor="end" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="500" fill="#565b63">v0.19.32</text>
</svg>
