<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      @aura/hello-world — right-rail panel sandbox.

      Mounted by the host as a srcdoc iframe with sandbox="allow-scripts"
      (NO allow-same-origin): this document's origin is opaque ("null"),
      it has no access to the shell's DOM, cookies, or storage, and the
      postMessage bridge is its only host channel. Inline script runs
      during parse, so the message listener below is registered before
      the host's handshake/hello arrives (the host attaches on iframe
      load). Same raw protocol as worker.js.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 14px;
        background: #111316;
        color: #d7dade;
        font:
          12px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        color: #8b919a;
      }
      button {
        background: #1d2026;
        color: #d7dade;
        border: 1px solid #2c3038;
        border-radius: 6px;
        padding: 5px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #5aa9e6;
      }
      #log {
        margin-top: 12px;
        padding: 8px;
        background: #16181d;
        border: 1px solid #23262d;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 60px;
      }
    </style>
  </head>
  <body>
    <h1>Hello from a plugin panel</h1>
    <p>Sandboxed srcdoc iframe · bridge-only host access.</p>
    <button id="toast-btn" type="button">Send a toast</button>
    <button id="status-btn" type="button">Read aura.status</button>
    <div id="log">waiting for handshake…</div>

    <script>
      const V = 1;
      let nextId = 1;
      const pending = new Map();
      const log = (line) => {
        const el = document.getElementById("log");
        el.textContent = line + "\n" + el.textContent;
      };

      function call(method, args, target) {
        return new Promise((resolve, reject) => {
          const id = "p" + nextId++;
          pending.set(id, { resolve, reject });
          // Opaque origin can't name the parent's origin — "*" is the
          // only valid targetOrigin from inside a null-origin sandbox.
          window.parent.postMessage(
            { v: V, kind: "call", id, method, target, args },
            "*",
          );
        });
      }

      window.addEventListener("message", (ev) => {
        const env = ev.data;
        if (!env || typeof env !== "object") return;
        if (env.kind === "handshake/hello") {
          window.parent.postMessage(
            {
              v: V,
              kind: "handshake/ready",
              pluginId: "@aura/hello-world",
              sdkVersion: "0.1.0-raw",
            },
            "*",
          );
          log("handshake ok (host " + env.hostVersion + ")");
          return;
        }
        if (env.kind === "result") {
          const p = pending.get(env.id);
          if (!p) return;
          pending.delete(env.id);
          if (env.ok) p.resolve(env.value);
          else p.reject(new Error(env.error ? env.error.message : "failed"));
        }
      });

      document.getElementById("toast-btn").addEventListener("click", () => {
        call("ui.toast", { message: "hi from the hello-world panel" })
          .then(() => log("toast sent"))
          .catch((e) => log("toast failed: " + e.message));
      });

      document.getElementById("status-btn").addEventListener("click", () => {
        call("aura.status", {})
          .then((s) => log("aura.status → " + JSON.stringify(s).slice(0, 400)))
          .catch((e) => log("status failed: " + e.message));
      });
    </script>
  </body>
</html>
