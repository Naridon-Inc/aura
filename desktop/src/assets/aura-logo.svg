<!-- The Aura mark, from the auravcs logo kit (public/auravcs-icon.svg).
     Monochrome variant: the two eyes are punched to real holes with a mask
     instead of being filled with the page colour, so this file also works as
     a CSS mask-image (BrandLogo tints it) — a filled disc would read as ink
     under a mask and swallow the 1 and the 0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -13 104 104" fill="none" role="img" aria-label="Aura">
  <mask id="auraLogoHoles" maskUnits="userSpaceOnUse" x="-4" y="-4" width="112" height="88">
    <rect x="-4" y="-4" width="112" height="88" fill="#fff"/>
    <ellipse cx="50.583" cy="48.377" rx="13.12" ry="18.196" transform="rotate(13.932 50.583 48.377)" fill="#000"/>
    <ellipse cx="86.319" cy="37.873" rx="11.604" ry="16.508" transform="rotate(9.405 86.319 37.873)" fill="#000"/>
  </mask>
  <g transform="translate(1 1)">
    <g mask="url(#auraLogoHoles)"><path d="M9 10 C4 11 0 15 0 20 L0 54 C0 56 1 57 3 58 L38 75 C41 76.2 45 76 48 74 C58 71 77 65 89 61 C95 59 100 55 102 47 L102 24 C102 21 101 18 97 16 C84 12 68 6 52 1 C49 .1 46 -.2 43 0 L9 10 Z" fill="currentColor"/></g>
    <path d="M47.4 45 L51.7 40.4 H54.6 V57.8 H50.1 V46.2 L47.4 48.2 Z" fill="currentColor"/>
    <ellipse cx="86.4" cy="37.86" rx="7.1" ry="10.4" transform="rotate(9.405 86.4 37.86)" fill="none" stroke="currentColor" stroke-width="3.6"/>
  </g>
</svg>
